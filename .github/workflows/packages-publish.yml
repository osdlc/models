# Releases the packages under profiles/ and corpora/ with Changesets on every
# push to main: validate.yml first, then ts-packages-release.yml from
# osdlc/osdlc, which opens the Version Packages pull request or publishes the
# versions not on npm yet. The root README describes the release steps.
#
# The packages hold Markdown and JSON Schema files and no code, so the release
# skips the build and `package-checks ts` (`ts-checks: false`) and names the
# package folders itself (`package-globs`).
#
# npm auth is trusted publishing (OIDC) only, with provenance. npm checks the
# calling workflow, so each package's trusted publisher on npmjs.com names
# this file, packages-publish.yml, and the file keeps its name. The `release`
# job grants `id-token: write`, which ts-packages-release.yml gives only to
# its `publish` job.
#
# The Version Packages pull request is opened as the osdlc-release GitHub App,
# whose key is in the release-plz environment. The `release` job passes the
# key by name; ts-packages-release.yml says why.
name: packages-publish

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: packages-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  release:
    needs: verify
    permissions:
      contents: write
      id-token: write
    # Pinned to the head of https://github.com/osdlc/osdlc/pull/785, which adds
    # `ts-checks` and `package-globs`. Repin to its merge commit once it merges.
    uses: osdlc/osdlc/.github/workflows/ts-packages-release.yml@109d218ca5dc46e9fa8f3142a54b8c5ed3671d42 # osdlc/osdlc#785 head
    with:
      app-client-id: Iv23liYTGAl78fzN8YWm
      ts-checks: false
      package-globs: profiles/* corpora/*
    secrets:
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
